<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230">
  <defs>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f0f2"/>
      <stop offset="100%" stop-color="#e2e4e8"/>
    </linearGradient>
    <linearGradient id="macBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6d9de"/>
      <stop offset="50%" stop-color="#c1c5cc"/>
      <stop offset="100%" stop-color="#a8adb6"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="skinGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eac0a2"/>
      <stop offset="100%" stop-color="#d4a382"/>
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2cfb3"/>
      <stop offset="100%" stop-color="#d9a888"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2b30"/>
      <stop offset="100%" stop-color="#131417"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Studio Desk Surface -->
  <rect width="340" height="230" rx="14" fill="url(#deskGrad)"/>

  <!-- Perspective Shadow under Laptop -->
  <ellipse cx="170" cy="158" rx="110" ry="18" fill="rgba(0,0,0,0.12)"/>
  <ellipse cx="170" cy="154" rx="95" ry="10" fill="rgba(0,0,0,0.18)"/>

  <!-- MacBook Base & Keyboard Deck -->
  <polygon points="65,148 275,148 260,112 80,112" fill="url(#macBody)" stroke="#9a9ea7" stroke-width="0.75"/>
  <!-- Front Lip -->
  <path d="M 65,148 Q 170,154 275,148 L 273,152 Q 170,158 67,152 Z" fill="#8c9099"/>
  <!-- Display Notch / Opening Cutout -->
  <rect x="156" y="148" width="28" height="3" rx="1" fill="#757982"/>

  <!-- Keyboard Area -->
  <polygon points="90,140 250,140 240,116 100,116" fill="#1e2024" rx="3"/>
  <!-- Key Rows (Subtle grid suggestion) -->
  <line x1="97" y1="122" x2="243" y2="122" stroke="#2c2e35" stroke-width="4" stroke-dasharray="8,2"/>
  <line x1="94" y1="128" x2="246" y2="128" stroke="#2c2e35" stroke-width="4" stroke-dasharray="8,2"/>
  <line x1="92" y1="134" x2="248" y2="134" stroke="#2c2e35" stroke-width="4" stroke-dasharray="9,2"/>

  <!-- Trackpad -->
  <polygon points="144,146 196,146 194,141 146,141" fill="#b5b9c2" stroke="#9da1aa" stroke-width="0.5"/>

  <!-- MacBook Display / Screen (Tilted Back) -->
  <polygon points="80,112 260,112 254,34 86,34" fill="url(#screenGrad)" stroke="#111215" stroke-width="2"/>
  <!-- Inner Display Active Screen -->
  <polygon points="84,108 256,108 250,38 90,38" fill="#181a20"/>
  <!-- UI Mockup Lines on Screen (Code / Figma Wireframe) -->
  <rect x="98" y="46" width="36" height="4" rx="1" fill="#6366f1" opacity="0.9"/>
  <rect x="98" y="54" width="70" height="3" rx="1" fill="#38bdf8" opacity="0.8"/>
  <rect x="98" y="60" width="55" height="3" rx="1" fill="#ec4899" opacity="0.8"/>
  <rect x="98" y="66" width="90" height="3" rx="1" fill="#a1a1aa" opacity="0.5"/>
  <rect x="98" y="72" width="65" height="3" rx="1" fill="#a1a1aa" opacity="0.4"/>
  <rect x="98" y="78" width="80" height="3" rx="1" fill="#a1a1aa" opacity="0.4"/>
  <!-- UI Artboard Box -->
  <rect x="180" y="48" width="60" height="48" rx="2" fill="#242731" stroke="#3f4354" stroke-width="0.8"/>
  <circle cx="210" cy="66" r="10" fill="#4f46e5" opacity="0.7"/>
  <rect x="190" y="82" width="40" height="4" rx="1" fill="#818cf8"/>

  <!-- Hands & Arms Typing on Keyboard -->
  <!-- Left Arm / Sleeve -->
  <path d="M 12,230 L 72,175 L 110,146 L 90,140 L 45,178 L 0,230 Z" fill="url(#sleeveGrad)"/>
  <!-- Left Hand & Wrist -->
  <path d="M 88,144 Q 106,134 124,136 Q 134,137 132,143 Q 118,150 98,150 Z" fill="url(#skinGrad1)"/>
  <!-- Left Fingers on Keys -->
  <ellipse cx="126" cy="136" rx="4" ry="2.5" fill="url(#skinGrad2)"/>
  <ellipse cx="120" cy="132" rx="4" ry="2.5" fill="url(#skinGrad2)"/>
  <ellipse cx="114" cy="131" rx="4" ry="2.5" fill="url(#skinGrad2)"/>

  <!-- Right Arm / Sleeve -->
  <path d="M 328,230 L 268,175 L 230,146 L 250,140 L 295,178 L 340,230 Z" fill="url(#sleeveGrad)"/>
  <!-- Right Hand & Wrist -->
  <path d="M 252,144 Q 234,134 216,136 Q 206,137 208,143 Q 222,150 242,150 Z" fill="url(#skinGrad1)"/>
  <!-- Right Fingers on Keys -->
  <ellipse cx="214" cy="136" rx="4" ry="2.5" fill="url(#skinGrad2)"/>
  <ellipse cx="220" cy="132" rx="4" ry="2.5" fill="url(#skinGrad2)"/>
  <ellipse cx="226" cy="131" rx="4" ry="2.5" fill="url(#skinGrad2)"/>

  <!-- Ambient Light Reflection on Outer Border -->
  <rect width="340" height="230" rx="14" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
</svg>
