<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;500;700&family=Inter:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-white: #ffffff;
      --color-bg-main: #060606;
      --color-white-85: rgba(255, 255, 255, 0.85);
      --color-white-65: rgba(255, 255, 255, 0.65);
      --color-white-50: rgba(255, 255, 255, 0.50);
      --color-white-20: rgba(255, 255, 255, 0.20);
      --color-white-10: rgba(255, 255, 255, 0.10);
      --color-white-06: rgba(255, 255, 255, 0.06);

      --font-display: 'Inter', sans-serif;
      --font-body: 'Geist Mono', monospace;
      --font-base: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg-main);
      color: var(--color-white);
      font-family: var(--font-base);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .bg-grid-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      justify-content: space-evenly;
      pointer-events: none;
      mask: radial-gradient(112% 108% at 56.2% -11.3%, #000 90.13%, transparent 100%);
      -webkit-mask: radial-gradient(112% 108% at 56.2% -11.3%, #000 90.13%, transparent 100%);
    }
    .bg-grid-line {
      width: 1px;
      height: 100%;
      background-color: var(--color-white-06);
    }

    .global-noise {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background-image: url('https://framerusercontent.com/images/6mcf62RlDfRfU61Yg5vb2pefpi4.png?width=256&height=256');
      background-repeat: repeat;
      background-size: 93.5px auto;
      opacity: 0.13;
      pointer-events: none;
      z-index: 0;
    }

    .not-found-container {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .h1-404 {
      font-family: var(--font-display);
      font-size: 140px;
      font-weight: 200;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 0;
    }

    .subtext-404 {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--color-white-65);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 0;
    }

    .back-btn {
      margin-top: 32px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border: 1px solid var(--color-white-20);
      border-radius: 8px;
      font-family: var(--font-base);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-white);
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--color-white-10);
      border-color: var(--color-white-50);
    }
    
    @media (max-width: 809px) {
      .h1-404 { font-size: 100px; }
    }
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div class="bg-grid-wrapper">
    <div class="bg-grid-line"></div>
    <div class="bg-grid-line"></div>
    <div class="bg-grid-line"></div>
    <div class="bg-grid-line"></div>
    <div class="bg-grid-line"></div>
  </div>
  <div class="global-noise"></div>

  <!-- Content -->
  <div class="not-found-container">
    <div class="h1-404">404</div>
    <div class="subtext-404">Page Not Found</div>
    
    <a href="index.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Return Home
    </a>
  </div>

</body>
</html>
